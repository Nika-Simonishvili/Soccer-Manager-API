services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soccer_manager_app
    ports:
      - "8000:8000"
    environment:
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - soccer_manager

  db:
    image: mysql:8.0
    container_name: soccer_manager_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: soccer_manager
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soccer_manager

volumes:
  db_data:

networks:
  soccer_manager:
    driver: bridge
